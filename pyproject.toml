[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fpl-agent"
version = "0.1.0"
description = "Read-only Fantasy Premier League decision-support agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "FPLexpert" }]
dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "httpx>=0.27",
  "PyYAML>=6.0",
  "typer>=0.12",
  "rich>=13.7",
  "tenacity>=8.3",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "hypothesis>=6.100",
  "respx>=0.21",
]
llm = [
  "openai>=1.40",
]

[project.scripts]
fpl-agent = "fpl_agent.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/fpl_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
  "live: opt-in live network smoke tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["B008", "E501", "UP046", "SIM102", "B017"]

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
  "hypothesis>=6.100",
  "respx>=0.21",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["fpl_agent"]
mypy_path = "src"

[tool.coverage.run]
branch = true
source = ["fpl_agent"]
