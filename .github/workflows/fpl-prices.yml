name: fpl-prices
on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Post a test comment as github-actions[bot] (email check)"
        type: boolean
        default: false
  schedule:
    # 18:00 Europe/Zagreb in summer (CEST = 16:00 UTC). Winter this is 17:00 Zagreb.
    # GitHub cron is often 1–3h late; aiming earlier so the job lands before ~21:00 CEST.
    - cron: "0 16 * * *"

permissions: {}

concurrency:
  group: fpl-prices
  cancel-in-progress: false

jobs:
  test_email:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_email }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Comment as Actions bot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue comment 1 --repo "${GITHUB_REPOSITORY}" --body "$(cat <<'EOF'
          **Email test from github-actions[bot]**

          If this reaches your inbox, overnight price alerts will use the same path (comments on issue #1 / "FPL price alerts").
          EOF
          )"
      - name: Summary
        run: |
          {
            echo "## Email test only"
            echo
            echo "The **prices** job was skipped. This run only posted a test comment."
            echo "Uncheck **test_email** (or wait for the 18:00 Zagreb schedule) to run the real price watch."
          } >> "$GITHUB_STEP_SUMMARY"

  prices:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.test_email == false }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Sync
        run: uv sync
      - name: Materialize private squad
        env:
          FPL_PRIVATE_STATE_B64: ${{ secrets.FPL_PRIVATE_STATE_B64 }}
        run: uv run fpl-agent team-state materialize-from-env
      - name: Price watch (no OpenAI)
        run: uv run fpl-agent prices --notify
      - name: Record last success
        run: |
          uv run python - <<'PY'
          import json
          import os
          from datetime import UTC, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          reports = sorted(
              Path("reports").glob("prices-gw*.json"),
              key=lambda p: p.stat().st_mtime,
          )
          status = "unknown"
          gameweek = None
          headline = ""
          md_text = ""
          notify_email = False
          if reports:
              payload = json.loads(reports[-1].read_text(encoding="utf-8"))
              status = payload.get("status") or status
              gameweek = payload.get("gameweek")
              headline = payload.get("headline") or ""
              notify_email = bool(payload.get("notify_email"))
              md_path = reports[-1].with_suffix(".md")
              if md_path.exists():
                  md_text = md_path.read_text(encoding="utf-8")
          now = datetime.now(UTC)
          local = now.astimezone(ZoneInfo("Europe/Zagreb"))
          stamp_utc = now.strftime("%Y-%m-%dT%H:%MZ")
          stamp_local = local.strftime("%Y-%m-%d %H:%M %Z")
          folder = Path("data/snapshots/prices")
          folder.mkdir(parents=True, exist_ok=True)
          (folder / "last-success.json").write_text(
              json.dumps(
                  {
                      "utc": stamp_utc,
                      "local": stamp_local,
                      "gameweek": gameweek,
                      "status": status,
                      "headline": headline,
                      "notify_email": notify_email,
                  },
                  indent=2,
              )
              + "\n",
              encoding="utf-8",
          )
          log = Path("run-log.md")
          if not log.exists():
              log.write_text(
                  "# Price watch run log\n\n"
                  "| Local (Zagreb) | UTC | GW | Status | Headline |\n"
                  "| --- | --- | --- | --- | --- |\n",
                  encoding="utf-8",
              )
          safe_headline = headline.replace("|", "/").replace("\n", " ")
          with log.open("a", encoding="utf-8") as fh:
              fh.write(
                  f"| {stamp_local} | {stamp_utc} | {gameweek or ''} | {status} | {safe_headline} |\n"
              )
          summary = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary:
              body = [
                  "## Price watch",
                  "",
                  f"- Local: **{stamp_local}**",
                  f"- UTC: `{stamp_utc}`",
                  f"- Gameweek: `{gameweek}`",
                  f"- Status: **{status}**",
                  f"- Headline: {headline or '(none)'}",
                  f"- Email comment: **{'yes' if notify_email else 'no'}**",
                  "",
                  "Email (GitHub Issue comment) when act-now **or** likely market movers.",
                  "Watch the **FPL price alerts** issue (or Actions email) to get notified.",
                  "",
              ]
              if md_text:
                  body.extend(["### Report", "", md_text[:12000], ""])
              Path(summary).write_text("\n".join(body), encoding="utf-8")
          print(status, stamp_local, "notify_email=", notify_email)
          from fpl_agent.reporting.readme_index import refresh_readme_recent_runs

          refresh_readme_recent_runs()
          PY
      - name: Email via GitHub Issue (act-now or likely market movers)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          uv run python - <<'PY'
          import json, subprocess, sys
          from pathlib import Path

          reports = sorted(Path("reports").glob("prices-gw*.json"), key=lambda p: p.stat().st_mtime)
          if not reports:
              print("no price report; skip issue")
              sys.exit(0)
          payload = json.loads(reports[-1].read_text(encoding="utf-8"))
          if not payload.get("notify_email"):
              print("quiet night; no issue comment")
              sys.exit(0)
          md = reports[-1].with_suffix(".md")
          body = md.read_text(encoding="utf-8")[:60000] if md.exists() else payload.get("headline", "price alert")
          title = "FPL price alerts"
          listed = subprocess.check_output(
              ["gh", "issue", "list", "--state", "open", "--search", f"{title} in:title", "--json", "number,title"],
              text=True,
          )
          matches = [i for i in json.loads(listed) if i.get("title") == title]
          if matches:
              number = str(matches[0]["number"])
          else:
              created = subprocess.check_output(
                  [
                      "gh", "issue", "create",
                      "--title", title,
                      "--body",
                      "Standing thread for overnight price alerts (act-now + likely market movers). "
                      "Watch this issue (Subscribe) to get GitHub notification emails.",
                  ],
                  text=True,
              )
              number = created.strip().rsplit("/", 1)[-1]
          subprocess.check_call(["gh", "issue", "comment", number, "--body", body])
          print(f"commented on issue {number}")
          PY
      - name: Persist public snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/snapshots/prices run-log.md README.md reports/
          if git diff --staged --quiet; then
            echo "no snapshot changes"
            exit 0
          fi
          git commit -m "chore: price snapshots [skip ci]"
          git push
